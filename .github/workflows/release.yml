name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Enable Rust compilation caching
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libudev-dev \
            rpm

      - name: Install packaging tools
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked

      - name: Run verification suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build production binaries
        run: |
          cargo build --release --bins --features gui

      - name: Generate Debian and RPM packages
        run: |
          cargo deb --no-build
          cargo generate-rpm

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_name == 'debug' || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-debug') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
