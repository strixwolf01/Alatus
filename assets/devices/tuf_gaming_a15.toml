[device]
name = "ASUS TUF Gaming A15 / F15"
vendor = "ASUSTeK COMPUTER INC."
match_product = ["FA506*", "FA507*", "FX506*", "FX507*", "TUF Gaming*"]
match_board = ["FA506*", "FA507*", "FX506*", "FX507*"]

[capabilities.rgb]
driver = "tuf_sysfs"
zones = 1
supports_timeout = true
default_timeout_policy = "Always"

[capabilities.thermal]
driver = "asus_wmi_debugfs"
profiles = ["quiet", "balanced", "performance"]
has_fan_curve = false

[capabilities.battery]
driver = "asus_charge_control"

[capabilities.display]
has_oled = false
supports_flicker_free = false
refresh_rates = [60, 144]

