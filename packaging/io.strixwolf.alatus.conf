<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root user to own the daemon D-Bus name -->
  <policy user="root">
    <allow own="io.strixwolf.alatus.Daemon"/>
  </policy>

  <!-- Allow anyone to send method calls to the daemon -->
  <policy context="default">
    <allow send_destination="io.strixwolf.alatus.Daemon"/>
    <allow send_interface="io.strixwolf.alatus.Daemon"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
