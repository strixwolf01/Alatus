<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ascendBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ascendAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#ascendBg)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Stylized Ascending Arrow / Chevron Geometry -->
  <path d="M 64 24 L 98 62 L 86 74 L 64 48 L 42 74 L 30 62 Z" fill="url(#ascendAccent)" />
  <path d="M 64 48 L 86 74 L 76 84 L 64 70 L 52 84 L 42 74 Z" fill="url(#chevronGrad)" opacity="0.95" />

  <!-- Speed / Cooling Indicator Accents -->
  <circle cx="64" cy="94" r="4" fill="#00d2ff" />
  <circle cx="50" cy="94" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="78" cy="94" r="3" fill="#38bdf8" opacity="0.7" />
  <circle cx="38" cy="94" r="2" fill="#818cf8" opacity="0.4" />
  <circle cx="90" cy="94" r="2" fill="#818cf8" opacity="0.4" />
</svg>

