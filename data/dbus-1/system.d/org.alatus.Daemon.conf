<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.alatus.Daemon"/>
    <allow send_destination="org.alatus.Daemon"/>
    <allow receive_sender="org.alatus.Daemon"/>
  </policy>

  <!-- Any user can send method calls and receive signals (polkit governs authorization) -->
  <policy context="default">
    <allow send_destination="org.alatus.Daemon"/>
    <allow receive_sender="org.alatus.Daemon"/>
  </policy>
</busconfig>
