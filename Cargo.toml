[package]
name = "alatus"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/strixwolf01/Alatus"
description = "Modern hardware orchestration suite for ASUS laptops on Linux"
authors = ["Alatus Contributors"]

[lib]
name = "alatus"
path = "src/lib.rs"

[[bin]]
name = "alatus"
path = "src/bin/alatus.rs"

[[bin]]
name = "alatusd"
path = "src/bin/alatusd.rs"

[[bin]]
name = "alatus-session"
path = "src/bin/alatus_session.rs"

[features]
gui = ["dep:slint", "dep:slint-build"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg"], optional = true }

thiserror = "2"
toml = "0.8"

[build-dependencies]
slint-build = { version = "1.9", optional = true }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.deb]
section = "utils"
maintainer = "Alatus Contributors"
maintainer-scripts = "packaging/deb"
features = ["gui"]
assets = [
    ["target/release/alatus", "usr/bin/alatus", "755"],
    ["target/release/alatusd", "usr/bin/alatusd", "755"],
    ["target/release/alatus-session", "usr/bin/alatus-session", "755"],
    ["packaging/io.strixwolf.alatus.desktop", "usr/share/applications/io.strixwolf.alatus.desktop", "644"],
    ["packaging/io.strixwolf.alatus.svg", "usr/share/icons/hicolor/scalable/apps/io.strixwolf.alatus.svg", "644"],
    ["packaging/alatus-gui.svg", "usr/share/icons/hicolor/scalable/apps/alatus-gui.svg", "644"],
    ["packaging/icons/32x32/apps/io.strixwolf.alatus.png", "usr/share/icons/hicolor/32x32/apps/io.strixwolf.alatus.png", "644"],
    ["packaging/icons/32x32/apps/alatus-gui.png", "usr/share/icons/hicolor/32x32/apps/alatus-gui.png", "644"],
    ["packaging/icons/48x48/apps/io.strixwolf.alatus.png", "usr/share/icons/hicolor/48x48/apps/io.strixwolf.alatus.png", "644"],
    ["packaging/icons/48x48/apps/alatus-gui.png", "usr/share/icons/hicolor/48x48/apps/alatus-gui.png", "644"],
    ["packaging/icons/64x64/apps/io.strixwolf.alatus.png", "usr/share/icons/hicolor/64x64/apps/io.strixwolf.alatus.png", "644"],
    ["packaging/icons/64x64/apps/alatus-gui.png", "usr/share/icons/hicolor/64x64/apps/alatus-gui.png", "644"],
    ["packaging/icons/128x128/apps/io.strixwolf.alatus.png", "usr/share/icons/hicolor/128x128/apps/io.strixwolf.alatus.png", "644"],
    ["packaging/icons/128x128/apps/alatus-gui.png", "usr/share/icons/hicolor/128x128/apps/alatus-gui.png", "644"],
    ["packaging/icons/256x256/apps/io.strixwolf.alatus.png", "usr/share/icons/hicolor/256x256/apps/io.strixwolf.alatus.png", "644"],
    ["packaging/icons/256x256/apps/alatus-gui.png", "usr/share/icons/hicolor/256x256/apps/alatus-gui.png", "644"],
    ["packaging/io.strixwolf.alatus.svg", "usr/share/pixmaps/io.strixwolf.alatus.svg", "644"],
    ["packaging/alatus-gui.svg", "usr/share/pixmaps/alatus-gui.svg", "644"],
    ["packaging/completions/alatus.bash", "usr/share/bash-completion/completions/alatus", "644"],
    ["packaging/completions/_alatus", "usr/share/zsh/site-functions/_alatus", "644"],
    ["packaging/completions/alatus.fish", "usr/share/fish/vendor_completions.d/alatus.fish", "644"],
    ["packaging/io.strixwolf.alatus.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/io.strixwolf.alatus.policy", "usr/share/polkit-1/actions/io.strixwolf.alatus.policy", "644"],
    ["packaging/alatusd.service", "usr/lib/systemd/system/alatusd.service", "644"],
    ["packaging/alatus-session.service", "usr/lib/systemd/user/alatus-session.service", "644"],
    ["packaging/graphical-session.target.wants/alatus-session.service", "usr/lib/systemd/user/graphical-session.target.wants/alatus-session.service", "644"],
    ["packaging/autostart/io.strixwolf.alatus.desktop", "etc/xdg/autostart/io.strixwolf.alatus.desktop", "644"],
