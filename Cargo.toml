    ["assets/icons/modes/quiet.svg", "usr/share/alatus/icons/modes/quiet.svg", "644"],
    ["assets/icons/modes/balanced.svg", "usr/share/alatus/icons/modes/balanced.svg", "644"],
    ["assets/icons/modes/performance.svg", "usr/share/alatus/icons/modes/performance.svg", "644"],
    ["assets/icons/modes/full_speed.svg", "usr/share/alatus/icons/modes/full_speed.svg", "644"],
    ["assets/icons/modes/quiet.svg", "usr/share/icons/hicolor/scalable/apps/alatus-mode-quiet.svg", "644"],
    ["assets/icons/modes/balanced.svg", "usr/share/icons/hicolor/scalable/apps/alatus-mode-balanced.svg", "644"],
    ["assets/icons/modes/performance.svg", "usr/share/icons/hicolor/scalable/apps/alatus-mode-performance.svg", "644"],
    ["assets/icons/modes/full_speed.svg", "usr/share/icons/hicolor/scalable/apps/alatus-mode-full-speed.svg", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/alatus", dest = "/usr/bin/alatus", mode = "755" },
    { source = "target/release/alatusd", dest = "/usr/bin/alatusd", mode = "755" },
    { source = "target/release/alatus-session", dest = "/usr/bin/alatus-session", mode = "755" },
    { source = "packaging/io.strixwolf.alatus.desktop", dest = "/usr/share/applications/io.strixwolf.alatus.desktop", mode = "644" },
    { source = "packaging/io.strixwolf.alatus.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.strixwolf.alatus.svg", mode = "644" },
    { source = "packaging/alatus-gui.svg", dest = "/usr/share/icons/hicolor/scalable/apps/alatus-gui.svg", mode = "644" },
    { source = "packaging/icons/32x32/apps/io.strixwolf.alatus.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.strixwolf.alatus.png", mode = "644" },
    { source = "packaging/icons/32x32/apps/alatus-gui.png", dest = "/usr/share/icons/hicolor/32x32/apps/alatus-gui.png", mode = "644" },
    { source = "packaging/icons/48x48/apps/io.strixwolf.alatus.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.strixwolf.alatus.png", mode = "644" },
    { source = "packaging/icons/48x48/apps/alatus-gui.png", dest = "/usr/share/icons/hicolor/48x48/apps/alatus-gui.png", mode = "644" },
    { source = "packaging/icons/64x64/apps/io.strixwolf.alatus.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.strixwolf.alatus.png", mode = "644" },
    { source = "packaging/icons/64x64/apps/alatus-gui.png", dest = "/usr/share/icons/hicolor/64x64/apps/alatus-gui.png", mode = "644" },
    { source = "packaging/icons/128x128/apps/io.strixwolf.alatus.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.strixwolf.alatus.png", mode = "644" },
    { source = "packaging/icons/128x128/apps/alatus-gui.png", dest = "/usr/share/icons/hicolor/128x128/apps/alatus-gui.png", mode = "644" },
    { source = "packaging/icons/256x256/apps/io.strixwolf.alatus.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.strixwolf.alatus.png", mode = "644" },
    { source = "packaging/icons/256x256/apps/alatus-gui.png", dest = "/usr/share/icons/hicolor/256x256/apps/alatus-gui.png", mode = "644" },
    { source = "packaging/io.strixwolf.alatus.svg", dest = "/usr/share/pixmaps/io.strixwolf.alatus.svg", mode = "644" },
    { source = "packaging/alatus-gui.svg", dest = "/usr/share/pixmaps/alatus-gui.svg", mode = "644" },
    { source = "packaging/completions/alatus.bash", dest = "/usr/share/bash-completion/completions/alatus", mode = "644" },
    { source = "packaging/completions/_alatus", dest = "/usr/share/zsh/site-functions/_alatus", mode = "644" },
    { source = "packaging/completions/alatus.fish", dest = "/usr/share/fish/vendor_completions.d/alatus.fish", mode = "644" },
    { source = "packaging/io.strixwolf.alatus.metainfo.xml", dest = "/usr/share/metainfo/io.strixwolf.alatus.metainfo.xml", mode = "644" },
    { source = "packaging/io.strixwolf.alatus.policy", dest = "/usr/share/polkit-1/actions/io.strixwolf.alatus.policy", mode = "644" },
    { source = "packaging/alatusd.service", dest = "/usr/lib/systemd/system/alatusd.service", mode = "644" },
    { source = "packaging/alatus-session.service", dest = "/usr/lib/systemd/user/alatus-session.service", mode = "644" },
    { source = "packaging/graphical-session.target.wants/alatus-session.service", dest = "/usr/lib/systemd/user/graphical-session.target.wants/alatus-session.service", mode = "644" },
    { source = "packaging/autostart/io.strixwolf.alatus.desktop", dest = "/etc/xdg/autostart/io.strixwolf.alatus.desktop", mode = "644" },
    { source = "packaging/io.strixwolf.alatus.conf", dest = "/usr/share/dbus-1/system.d/io.strixwolf.alatus.Daemon.conf", mode = "644" },
    { source = "packaging/udev/99-alatus-rgb.rules", dest = "/usr/lib/udev/rules.d/99-alatus-rgb.rules", mode = "644" },
    { source = "assets/icons/modes/quiet.svg", dest = "/usr/share/alatus/icons/modes/quiet.svg", mode = "644" },
    { source = "assets/icons/modes/balanced.svg", dest = "/usr/share/alatus/icons/modes/balanced.svg", mode = "644" },
    { source = "assets/icons/modes/performance.svg", dest = "/usr/share/alatus/icons/modes/performance.svg", mode = "644" },
    { source = "assets/icons/modes/full_speed.svg", dest = "/usr/share/alatus/icons/modes/full_speed.svg", mode = "644" },
    { source = "assets/icons/modes/quiet.svg", dest = "/usr/share/icons/hicolor/scalable/apps/alatus-mode-quiet.svg", mode = "644" },
    { source = "assets/icons/modes/balanced.svg", dest = "/usr/share/icons/hicolor/scalable/apps/alatus-mode-balanced.svg", mode = "644" },
    { source = "assets/icons/modes/performance.svg", dest = "/usr/share/icons/hicolor/scalable/apps/alatus-mode-performance.svg", mode = "644" },
    { source = "assets/icons/modes/full_speed.svg", dest = "/usr/share/icons/hicolor/scalable/apps/alatus-mode-full-speed.svg", mode = "644" },
